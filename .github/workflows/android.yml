name: Android CI

# ★Fable統合: PE(Android/Room) ⇄ Fable(Codex) の同期は「決定論の純粋ロジック +
# 通信アダプタ」の二層に分かっている。通信は実機でしか確認できないが、純粋ロジック
# (codex-sync/1 の写像・LWW・tombstone) はJVM単体テストで毎回機械確認する。
# サンドボックスにAndroid SDKが無い環境でも、このワークフローが唯一のビルド確認手段。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
